name: Publish PyPI

on:
    release:
        types: [published]

# Required by PyPI's OIDC trusted publisher workflow.
permissions:
    contents: read
    id-token: write

jobs:
    build:
        name: Build and publish
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            pythonversion: "3.12"
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Python ${{ env.pythonversion }}
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ env.pythonversion }}

            - name: Setup uv
              uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install dependencies
              run: uv sync --group dev

            - name: Derive version from tag
              id: get_version
              run: |
                  realversion="${GITHUB_REF#refs/tags/}"
                  realversion="${realversion#v}"
                  echo "version=$realversion" >> "$GITHUB_OUTPUT"

            - name: Verify pyproject.toml matches the release tag
              env:
                  EXPECTED_VERSION: ${{ steps.get_version.outputs.version }}
              run: |
                  actual="$(uv version --short)"
                  if [ "$actual" != "$EXPECTED_VERSION" ]; then
                      echo "::error::Release tag v$EXPECTED_VERSION does not match pyproject.toml version $actual"
                      echo "Bump pyproject.toml to '$EXPECTED_VERSION' with: uv version $EXPECTED_VERSION"
                      exit 1
                  fi
                  echo "pyproject.toml version ($actual) matches tag."

            - name: Generate sync mirror (redis_om, tests_sync)
              run: make sync

            - name: Lint
              run: make lint

            - name: Test
              env:
                  REDIS_OM_URL: "redis://localhost:6379?decode_responses=True"
              run: |
                  docker compose up -d
                  make test
                  docker compose down

            - name: Build distributions
              run: uv build

            - name: Publish to PyPI
              # Uses PyPI's OIDC trusted publishing — no secret token required.
              # Configure the publisher at
              # https://pypi.org/manage/account/publishing/ with this
              # workflow's path + tag environment.
              run: uv publish dist/*
